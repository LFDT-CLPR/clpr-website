# Weekly check, and again when a sync lands on main: have any of the explainer's pinned upstream
# repos moved? If so, open (or update) an issue listing the new commits so a maintainer can run the
# clpr-sync skill; once every pin matches upstream again, close it. Never edits content.
name: Upstream watch

on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths: ['explainer/src/data/sources.json']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    # A fork runs its own pushes but has no tracking issue; only the main repository files one.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Compare pinned commits with upstream HEAD
        id: cmp
        run: |
          pnpm --filter clpr-explainer exec kse sync-upstream --report-only > report.md
          if grep -q '^- \*\*' report.md; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          {
            echo
            echo '## Detail still on the pages'
            echo
            echo 'A sync should delete this detail where it can, not update it (explainer/docs/writing-guide.md, Keep it stable).'
            echo
            (cd explainer && node checks/check-detail.mjs --list)
          } >> report.md
          cat report.md
      - name: Open or update the tracking issue
        if: steps.cmp.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const title = 'Upstream CLPR repos have moved: run the clpr-sync skill';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream-sync' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['upstream-sync'] });
            }
      # Skipped when the comparison step fails, so a broken check never closes the issue.
      - name: Close the tracking issue once the pins are current
        if: steps.cmp.outputs.changed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream CLPR repos have moved: run the clpr-sync skill';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream-sync' });
            for (const issue of issues.filter(i => i.title === title)) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `Every pinned commit now matches upstream \`HEAD\` ([run](${runUrl})). Closing.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
